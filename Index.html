<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo LMS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body{background:#f1f5f9;color:#1e293b;min-height:100vh}
  header{background:#2563eb;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:20px}
  header button{background:#fff;color:#2563eb;border:0;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
  .wrap{max-width:420px;margin:40px auto;padding:0 16px}
  .card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  .tabs{display:flex;margin-bottom:18px;border-bottom:2px solid #e2e8f0}
  .tabs button{flex:1;background:none;border:0;padding:10px;font-size:16px;cursor:pointer;color:#64748b}
  .tabs button.active{color:#2563eb;border-bottom:3px solid #2563eb;font-weight:600}
  label{display:block;font-size:14px;margin:12px 0 4px;color:#475569}
  input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
  .btn{width:100%;margin-top:18px;padding:12px;background:#2563eb;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.6}
  .msg{margin-top:14px;padding:10px;border-radius:8px;font-size:14px;display:none}
  .msg.err{display:block;background:#fee2e2;color:#b91c1c}
  .msg.ok{display:block;background:#dcfce7;color:#166534}
  .hidden{display:none}
  .dash{max-width:900px;margin:30px auto;padding:0 16px}
  .badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:3px 10px;border-radius:20px;font-size:13px;margin-left:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px}
  .tile{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .tile h3{font-size:16px;margin-bottom:6px}
  .tile p{font-size:14px;color:#64748b}
</style>
</head>
<body>

<header>
  <h1 id="siteName">Demo LMS</h1>
  <button id="logoutBtn" class="hidden" onclick="logout()">लॉगआउट</button>
</header>

<!-- लॉगिन / साइन-अप -->
<div id="authView" class="wrap">
  <div class="card">
    <div class="tabs">
      <button id="tLogin" class="active" onclick="showTab('login')">लॉगिन</button>
      <button id="tSignup" onclick="showTab('signup')">नया अकाउंट</button>
    </div>

    <form id="loginForm" onsubmit="doLogin(event)">
      <label>ईमेल</label>
      <input id="lEmail" type="email" required>
      <label>पासवर्ड</label>
      <input id="lPass" type="password" required>
      <button class="btn" type="submit">लॉगिन करें</button>
    </form>

    <form id="signupForm" class="hidden" onsubmit="doSignup(event)">
      <label>पूरा नाम</label>
      <input id="sName" required>
      <label>ईमेल</label>
      <input id="sEmail" type="email" required>
      <label>मोबाइल नंबर</label>
      <input id="sPhone" type="tel">
      <label>पासवर्ड (कम से कम 6 अक्षर)</label>
      <input id="sPass" type="password" minlength="6" required>
      <button class="btn" type="submit">अकाउंट बनाएँ</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>
</div>

<!-- डैशबोर्ड -->
<div id="dashView" class="dash hidden">
  <h2>नमस्ते, <span id="uName"></span><span id="uRole" class="badge"></span></h2>
  <div id="tiles" class="grid"></div>
</div>

<script>
// ===== यहाँ अपना Apps Script Web App URL =====
const API = "https://script.google.com/macros/s/AKfycbxmOfi8cXdPta-ITlweWlUuIycmLrQ8ZESLwFBuGaWj1EXTCT-rTdm6DKDndJ4mnsqR/exec";
const SITE_NAME = "Demo LMS"; // बाद में अपने डोमेन का नाम डालें

document.getElementById('siteName').textContent = SITE_NAME;
document.title = SITE_NAME;

async function api(action, data = {}) {
  // text/plain भेजते हैं ताकि Apps Script के साथ CORS की दिक्कत न आए
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...data })
  });
  return res.json();
}

function showMsg(text, ok) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
}

function showTab(t) {
  document.getElementById('loginForm').classList.toggle('hidden', t !== 'login');
  document.getElementById('signupForm').classList.toggle('hidden', t !== 'signup');
  document.getElementById('tLogin').classList.toggle('active', t === 'login');
  document.getElementById('tSignup').classList.toggle('active', t === 'signup');
  document.getElementById('msg').className = 'msg';
}

async function doLogin(e) {
  e.preventDefault();
  const btn = e.submitter; btn.disabled = true; btn.textContent = 'रुकिए...';
  try {
    const r = await api('login', {
      email: document.getElementById('lEmail').value,
      password: document.getElementById('lPass').value
    });
    if (r.ok) { localStorage.setItem('token', r.token); showDash(r.user); }
    else showMsg(r.error, false);
  } catch (err) { showMsg('नेटवर्क में दिक्कत है, फिर से कोशिश करें', false); }
  btn.disabled = false; btn.textContent = 'लॉगिन करें';
}

async function doSignup(e) {
  e.preventDefault();
  const btn = e.submitter; btn.disabled = true; btn.textContent = 'रुकिए...';
  try {
    const r = await api('signup', {
      name: document.getElementById('sName').value,
      email: document.getElementById('sEmail').value,
      phone: document.getElementById('sPhone').value,
      password: document.getElementById('sPass').value
    });
    if (r.ok) { showTab('login'); showMsg('अकाउंट बन गया! अब लॉगिन करें।', true);
                document.getElementById('lEmail').value = document.getElementById('sEmail').value; }
    else showMsg(r.error, false);
  } catch (err) { showMsg('नेटवर्क में दिक्कत है, फिर से कोशिश करें', false); }
  btn.disabled = false; btn.textContent = 'अकाउंट बनाएँ';
}

function showDash(user) {
  document.getElementById('authView').classList.add('hidden');
  document.getElementById('dashView').classList.remove('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');
  document.getElementById('uName').textContent = user.name;
  const roles = { student: 'स्टूडेंट', teacher: 'टीचर', admin: 'एडमिन' };
  document.getElementById('uRole').textContent = roles[user.role] || user.role;

  const tiles = {
    student: [['मेरे कोर्स', 'जल्द आ रहा है'], ['सभी कोर्स देखें', 'जल्द आ रहा है']],
    teacher: [['मेरे कोर्स', 'जल्द आ रहा है'], ['नया कोर्स बनाएँ', 'जल्द आ रहा है']],
    admin:   [['टीचर जोड़ें', 'जल्द आ रहा है'], ['पेमेंट वेरीफाई', 'जल्द आ रहा है'], ['कोर्स मंज़ूरी', 'जल्द आ रहा है']]
  }[user.role] || [];
  document.getElementById('tiles').innerHTML =
    tiles.map(t => `<div class="tile"><h3>${t[0]}</h3><p>${t[1]}</p></div>`).join('');
}

async function logout() {
  const token = localStorage.getItem('token');
  localStorage.removeItem('token');
  if (token) api('logout', { token }).catch(() => {});
  location.reload();
}

// पेज खुलते ही: अगर पहले से लॉगिन है तो सीधे डैशबोर्ड
(async () => {
  const token = localStorage.getItem('token');
  if (!token) return;
  try {
    const r = await api('me', { token });
    if (r.ok) showDash(r.user); else localStorage.removeItem('token');
  } catch (e) {}
})();
</script>
</body>
</html>
