<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo LMS</title>
<!-- वेबसाइट वाला कोड - वर्ज़न 5 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body{background:#f1f5f9;color:#1e293b;min-height:100vh}
  header{background:#2563eb;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
  header h1{font-size:20px;cursor:pointer}
  header button{background:#fff;color:#2563eb;border:0;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
  main{max-width:960px;margin:24px auto;padding:0 16px}
  .narrow{max-width:420px;margin:16px auto}
  .card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:16px}
  .card h3{margin-bottom:8px}
  .tabs{display:flex;margin-bottom:18px;border-bottom:2px solid #e2e8f0}
  .tabs button{flex:1;background:none;border:0;padding:10px;font-size:16px;cursor:pointer;color:#64748b}
  .tabs button.active{color:#2563eb;border-bottom:3px solid #2563eb;font-weight:600}
  label{display:block;font-size:14px;margin:12px 0 4px;color:#475569}
  input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:#fff}
  textarea{min-height:80px;resize:vertical}
  .btn{display:inline-block;margin-top:16px;padding:11px 18px;background:#2563eb;color:#fff;border:0;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
  .btn.full{width:100%;text-align:center}
  .btn.green{background:#16a34a}.btn.red{background:#dc2626}.btn.gray{background:#64748b}
  .btn.sm{padding:7px 12px;font-size:13px;margin-top:0}
  .btn:disabled{opacity:.6}
  .back{background:none;border:0;color:#2563eb;font-size:15px;cursor:pointer;margin-bottom:12px}
  .msg{margin-top:14px;padding:10px;border-radius:8px;font-size:14px}
  .msg.err{background:#fee2e2;color:#b91c1c}
  .msg.ok{background:#dcfce7;color:#166534}
  .msg.wait{background:#fef9c3;color:#854d0e}
  .hidden{display:none!important}
  .badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:3px 10px;border-radius:20px;font-size:12px;margin-left:6px;vertical-align:middle}
  .badge.draft{background:#f1f5f9;color:#475569}.badge.pending{background:#fef9c3;color:#854d0e}
  .badge.published{background:#dcfce7;color:#166534}.badge.rejected{background:#fee2e2;color:#b91c1c}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:16px}
  .tile{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;transition:transform .1s}
  .tile:hover{transform:translateY(-2px)}
  .tile h3{font-size:16px;margin-bottom:6px}
  .tile p{font-size:14px;color:#64748b}
  .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#e2e8f0;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:36px}
  .price{font-weight:700;color:#16a34a}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e2e8f0}
  .row:last-child{border-bottom:0}
  .ch{cursor:pointer;padding:12px 10px;border-radius:8px}
  .ch:hover{background:#f8fafc}
  .ch.active{color:#2563eb;font-weight:600;background:#eff6ff}
  h2{margin-bottom:6px}
  .muted{color:#64748b;font-size:14px}
  .loader{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#2563eb,#60a5fa,#2563eb);background-size:200% 100%;animation:ld 1s linear infinite;z-index:200}
  @keyframes ld{to{background-position:-200% 0}}

  /* पेमेंट */
  .paybox{border:2px dashed #cbd5e1;border-radius:14px;padding:18px;margin-top:16px;text-align:center}
  .paybox h3{font-size:16px;margin-bottom:4px}
  .step{display:inline-block;background:#2563eb;color:#fff;width:24px;height:24px;border-radius:50%;font-size:13px;line-height:24px;margin-right:6px}
  #qr{display:flex;justify-content:center;margin:14px 0}
  #qr img,#qr canvas{background:#fff;padding:8px;border-radius:8px;border:1px solid #e2e8f0}
  .upiline{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:15px}
  .upiline code{background:#f1f5f9;padding:6px 10px;border-radius:6px;font-size:15px}
  .bigamt{font-size:28px;font-weight:800;color:#16a34a;margin:4px 0}
  .utr{font-size:20px;letter-spacing:2px;text-align:center}
  .paycard .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .utrbig{font-family:monospace;font-size:18px;font-weight:700;letter-spacing:1px;background:#f1f5f9;padding:6px 10px;border-radius:6px;display:inline-block;margin:8px 0}

  /* चैप्टर टैब */
  .ctabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .ctabs button{flex:1 1 30%;min-width:90px;padding:10px 6px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;font-size:14px;cursor:pointer;color:#475569}
  .ctabs button.active{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:600}

  /* होमवर्क, टेस्ट, डाउट */
  .hw{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:12px}
  .hw h4{font-size:16px}
  details summary{cursor:pointer;color:#2563eb;font-size:14px}
  .q{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:12px}
  .qt{font-weight:600;margin-bottom:8px;white-space:pre-line}
  .opt{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #e2e8f0;border-radius:8px;margin:6px 0;cursor:pointer;font-size:15px;color:#1e293b}
  .opt input{width:auto;margin:0;flex-shrink:0}
  .opt.right{background:#dcfce7;border-color:#16a34a}
  .opt.wrong{background:#fee2e2;border-color:#dc2626}
  .exp{margin-top:8px;font-size:14px;color:#475569;background:#f8fafc;padding:8px;border-radius:8px;white-space:pre-line}
  .score{background:#eff6ff;border-radius:12px;padding:16px;text-align:center;margin-bottom:14px}
  .score .big{font-size:32px;font-weight:800;color:#2563eb}
  .doubt{border-bottom:1px solid #e2e8f0;padding:12px 0}
  .doubt:last-child{border-bottom:0}
  .doubt p{margin-bottom:4px}
  .ans{background:#f0fdf4;border-left:3px solid #16a34a;padding:8px 10px;border-radius:6px;margin-top:6px}
  .imgview{background:#f1f5f9;border-radius:12px;padding:8px;margin:12px 0;text-align:center}
  .imgview img{max-width:100%;border-radius:8px}

  /* वीडियो प्लेयर */
  .vp{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;user-select:none;-webkit-user-select:none}
  .vp .yt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .vp .yt iframe{width:100%;height:100%;border:0;pointer-events:none}
  .vp .shield{position:absolute;inset:0;z-index:3;cursor:pointer;background:transparent}
  .vp .cover{position:absolute;inset:0;z-index:2;background:#0f172a;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
  .vp .cover.gone{opacity:0;pointer-events:none}
  .vp .bigplay{width:72px;height:72px;border-radius:50%;background:rgba(37,99,235,.95);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;padding-left:5px}
  .vp .bar{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:8px 10px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;transition:opacity .25s}
  .vp.idle .bar{opacity:0}
  .vp .seek{width:100%;height:4px;padding:0;margin:0 0 6px;accent-color:#3b82f6;cursor:pointer;border:0}
  .vp .ctrls{display:flex;align-items:center;gap:6px}
  .vp .ctrls button{background:none;border:0;color:#fff;font-size:18px;padding:6px 8px;cursor:pointer;border-radius:6px;min-width:36px}
  .vp .time{font-size:13px;margin-left:4px;white-space:nowrap}
  .vp .sp{margin-left:auto;width:auto;padding:4px 6px;font-size:13px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px}
  .vp .sp option{color:#000}
  .vp.fs,.vp:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
  .vp.fs{position:fixed;inset:0;z-index:100}

  /* अपना PDF व्यूअर (स्मूथ: सिर्फ़ दिखने वाले पन्ने बनते हैं) */
  .pv{display:flex;flex-direction:column;height:80vh;height:80dvh;background:#525659;border-radius:12px;overflow:hidden;user-select:none;-webkit-user-select:none;margin-top:8px}
  .pv .pbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#1e293b;color:#fff;flex-shrink:0}
  .pv .pbar button{background:rgba(255,255,255,.12);border:0;color:#fff;font-size:17px;width:38px;height:34px;border-radius:8px;cursor:pointer}
  .pv .pbar .pinfo{font-size:14px;margin:0 6px;white-space:nowrap}
  .pv .pbar .sp2{flex:1}
  .pv .pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 8px;touch-action:pan-x pan-y}
  .pv .pg{margin:0 auto 10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .pv .pg canvas{display:block;width:100%;height:100%}
  .pv .pmsg{color:#fff;text-align:center;padding:40px 16px;font-size:15px}
  .pv.fs,.pv:fullscreen{border-radius:0;width:100vw;height:100vh;height:100dvh;margin:0}
  .pv.fs{position:fixed;inset:0;z-index:100}
  @media print{body{display:none}}
</style>
</head>
<body oncontextmenu="return false">

<header>
  <h1 id="siteName" onclick="if(USER)home()">Demo LMS</h1>
  <button id="logoutBtn" class="hidden" onclick="logout()">लॉगआउट</button>
</header>
<main id="app"></main>
<div id="loader" class="loader hidden"></div>

<script>
// ===== सेटिंग =====
const API = "https://script.google.com/macros/s/AKfycbxmOfi8cXdPta-ITlweWlUuIycmLrQ8ZESLwFBuGaWj1EXTCT-rTdm6DKDndJ4mnsqR/exec";
const SITE_NAME = "Demo LMS";
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let USER = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = html => { stopPlayer(); stopPdf(); $('app').innerHTML = html; window.scrollTo(0, 0); };
const statusName = { draft:'ड्राफ़्ट', pending:'मंज़ूरी बाकी', published:'पब्लिश', rejected:'रिजेक्ट' };
$('siteName').textContent = SITE_NAME; document.title = SITE_NAME;

let busy = 0;
async function api(action, data = {}) {
  busy++; $('loader').classList.remove('hidden');
  try {
    const res = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action, token: localStorage.getItem('token'), ...data }) });
    const r = await res.json();
    if (r.relogin) { localStorage.removeItem('token'); USER = null; authView('दोबारा लॉगिन करें'); throw new Error('relogin'); }
    return r;
  } catch (e) {
    if (e.message !== 'relogin') { e.message = 'नेटवर्क में दिक्कत है, फिर से कोशिश करें'; }
    throw e;
  } finally { if (--busy <= 0) { busy = 0; $('loader').classList.add('hidden'); } }
}

function msg(id, text, ok) { const m = $(id); if (m) { m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = text; } }
const backBtn = (fn = 'home()') => `<button class="back" onclick="${fn}">← वापस</button>`;
function fail(e) { if (e && e.message !== 'relogin') alert(e.message); }

async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = '✓ कॉपी हुआ'; setTimeout(() => btn.textContent = o, 1500); }
}

// ================= लॉगिन / साइन-अप =================
function authView(note) {
  $('logoutBtn').classList.add('hidden');
  app(`<div class="narrow card">
    <div class="tabs">
      <button id="tLogin" class="active" onclick="showTab('login')">लॉगिन</button>
      <button id="tSignup" onclick="showTab('signup')">नया अकाउंट</button>
    </div>
    <form id="loginForm" onsubmit="doLogin(event)">
      <label>ईमेल</label><input id="lEmail" type="email" required>
      <label>पासवर्ड</label><input id="lPass" type="password" required>
      <button class="btn full" type="submit">लॉगिन करें</button>
      <p class="muted" style="margin-top:12px">पासवर्ड भूल गए? एडमिन से संपर्क करें।</p>
    </form>
    <form id="signupForm" class="hidden" onsubmit="doSignup(event)">
      <label>पूरा नाम</label><input id="sName" required>
      <label>ईमेल</label><input id="sEmail" type="email" required>
      <label>मोबाइल नंबर</label><input id="sPhone" type="tel">
      <label>पासवर्ड (कम से कम 6 अक्षर)</label><input id="sPass" type="password" minlength="6" required>
      <button class="btn full" type="submit">अकाउंट बनाएँ</button>
    </form>
    <div id="amsg"></div>
  </div>`);
  if (note) msg('amsg', note, false);
}

function showTab(t) {
  $('loginForm').classList.toggle('hidden', t !== 'login');
  $('signupForm').classList.toggle('hidden', t !== 'signup');
  $('tLogin').classList.toggle('active', t === 'login');
  $('tSignup').classList.toggle('active', t === 'signup');
  $('amsg').className = ''; $('amsg').textContent = '';
}

async function doLogin(e) {
  e.preventDefault();
  try {
    const r = await api('login', { email: $('lEmail').value, password: $('lPass').value });
    if (r.ok) { localStorage.setItem('token', r.token); USER = r.user; home(); }
    else msg('amsg', r.error, false);
  } catch (err) { msg('amsg', err.message, false); }
}

async function doSignup(e) {
  e.preventDefault();
  const email = $('sEmail').value;
  try {
    const r = await api('signup', { name: $('sName').value, email, phone: $('sPhone').value, password: $('sPass').value });
    if (r.ok) { showTab('login'); $('lEmail').value = email; msg('amsg', 'अकाउंट बन गया! अब लॉगिन करें।', true); }
    else msg('amsg', r.error, false);
  } catch (err) { msg('amsg', err.message, false); }
}

async function logout() {
  const token = localStorage.getItem('token');
  localStorage.removeItem('token'); USER = null;
  if (token) fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'logout', token }) }).catch(()=>{});
  authView();
}

// ================= होम =================
function home() {
  $('logoutBtn').classList.remove('hidden');
  const roles = { student:'स्टूडेंट', teacher:'टीचर', admin:'एडमिन' };
  const tiles = {
    student: [['📚 मेरे कोर्स','जो कोर्स आपने शुरू किए','myCourses()'], ['🔍 सभी कोर्स देखें','नए कोर्स खोजें','allCourses()'],
              ['📅 लाइव क्लास','आने वाली क्लास','myLive()']],
    teacher: [['📥 चेक करना बाकी','होमवर्क और डाउट','inbox()'], ['📚 मेरे कोर्स','कोर्स, होमवर्क, टेस्ट, लाइव क्लास','teacherCourses()'],
              ['➕ नया कोर्स बनाएँ','नया कोर्स शुरू करें','courseForm()'], ['📅 लाइव क्लास','आपकी आने वाली क्लास','myLive()']],
    admin:   [['💰 पेमेंट वेरीफाई','स्टूडेंट के UPI पेमेंट चेक करें','adminPayments()'], ['✅ कोर्स मंज़ूरी','टीचर के भेजे कोर्स चेक करें','pendingCourses()'],
              ['📥 चेक करना बाकी','सभी होमवर्क और डाउट','inbox()'], ['👩‍🏫 टीचर जोड़ें','नया टीचर अकाउंट बनाएँ','teacherForm()'],
              ['🔍 सभी कोर्स','पब्लिश हुए कोर्स देखें','allCourses()'], ['➕ अपना कोर्स बनाएँ','एडमिन भी कोर्स बना सकता है','courseForm()'],
              ['📚 मेरे बनाए कोर्स','','teacherCourses()'], ['📅 लाइव क्लास','सभी आने वाली क्लास','myLive()']]
  }[USER.role] || [];
  app(`<h2>नमस्ते, ${esc(USER.name)} <span class="badge">${roles[USER.role] || USER.role}</span></h2>
    <div class="grid">${tiles.map(t => `<div class="tile" onclick="${t[2]}"><h3>${t[0]}</h3><p>${t[1]}</p></div>`).join('')}</div>`);
}

// ================= कोर्स कार्ड =================
function cardHtml(c, onclick, showStatus) {
  const thumb = c.thumb ? `<img class="thumb" src="${esc(c.thumb)}" alt="">` : `<div class="thumb">📘</div>`;
  return `<div class="tile" onclick="${onclick}">${thumb}
    <h3>${esc(c.title)} ${showStatus ? `<span class="badge ${esc(c.status)}">${statusName[c.status] || esc(c.status)}</span>` : ''}</h3>
    <p>${esc(c.teacher)}${c.subject ? ' • ' + esc(c.subject) : ''} • ${c.chapters} चैप्टर</p>
    <p class="price">${c.price > 0 ? '₹' + c.price : 'फ्री'}</p></div>`;
}

async function allCourses() {
  try {
    const r = await api('listCourses'); if (!r.ok) return alert(r.error);
    app(`${backBtn()}<h2>सभी कोर्स</h2>
      ${r.courses.length ? `<div class="grid">${r.courses.map(c => cardHtml(c, `openCourse('${c.id}')`)).join('')}</div>`
                         : '<p class="muted">अभी कोई कोर्स पब्लिश नहीं हुआ है।</p>'}`);
  } catch (e) { fail(e); }
}

async function myCourses() {
  try {
    const r = await api('myEnrollments'); if (!r.ok) return alert(r.error);
    app(`${backBtn()}<h2>मेरे कोर्स</h2>
      ${r.courses.length ? `<div class="grid">${r.courses.map(c => cardHtml(c, `openCourse('${c.id}')`)).join('')}</div>`
                         : '<p class="muted">आपने अभी कोई कोर्स शुरू नहीं किया। <a href="#" onclick="allCourses();return false">कोर्स देखें</a></p>'}`);
  } catch (e) { fail(e); }
}

// ================= लाइव क्लास =================
function liveHtml(list, o = {}) {
  if (!list || !list.length) return '<p class="muted">अभी कोई लाइव क्लास तय नहीं है।</p>';
  const now = Date.now();
  return list.map(l => {
    const st = new Date(l.start).getTime(), on = now >= st - 15 * 60000 && now <= l.end;
    const when = new Date(l.start).toLocaleString('hi-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
    const join = (on || o.teacher)
      ? `<a class="btn ${on ? 'green' : 'gray'} sm" href="${esc(l.link)}" target="_blank" rel="noopener">${on ? '🔴 जुड़ें' : 'खोलें'}</a>`
      : `<span class="badge">जल्द</span>`;
    return `<div class="row"><span><b>${esc(l.title)}</b>${o.course ? `<br><span class="muted">${esc(l.course)}</span>` : ''}
        <br><span class="muted">🕒 ${when} • ${l.duration} मिनट</span></span>
      <span style="white-space:nowrap">${join}${o.del ? ` <button class="btn red sm" onclick="delLive('${l.id}','${l.courseId}')">हटाएँ</button>` : ''}</span></div>`;
  }).join('');
}

async function myLive() {
  try {
    const r = await api('myLiveClasses'); if (!r.ok) return alert(r.error);
    app(`${backBtn()}<h2>📅 लाइव क्लास</h2>

  const c = r.course, p = r.pay;
  return 'upi://pay?pa=' + encodeURIComponent(p.upi) + '&pn=' + encodeURIComponent(p.name) +
         '&am=' + c.price + '&cu=INR&tn=' + encodeURIComponent(String(c.title).slice(0, 40));
}

    return `<div class="msg wait">⏳ आपका पेमेंट (UTR: ${esc(p.utr)}) जाँच में है। मंज़ूरी मिलते ही ये कोर्स "मेरे कोर्स" में खुल जाएगा।</div>`;

          <p class="muted" style="margin-top:12px">या दूसरे फ़ोन से ये QR स्कैन करें</p>` : `<p class="muted">किसी भी UPI ऐप से ये QR स्कैन करें</p>`}
        <div id="qr"></div>
        <div class="upiline">UPI ID: <code>${esc(r.pay.upi)}</code>
          <button class="btn sm gray" onclick="copyText('${esc(r.pay.upi)}', this)">कॉपी</button></div>
        <p class="muted" style="margin-top:6px">नाम: ${esc(r.pay.name)}</p>
      </div>
      <div class="paybox">
        <h3><span class="step">2</span>UTR नंबर डालें</h3>
        <p class="muted">पेमेंट के बाद UPI ऐप में "UTR" या "UPI Ref No." वाला 12 अंकों का नंबर मिलेगा।</p>
        <form onsubmit="sendPayment(event,'${c.id}')">

          <button class="btn full" type="submit">पेमेंट जमा करें</button>

async function sendPayment(e, cid) {
  e.preventDefault();
  const utr = $('utrIn').value.replace(/\s/g, '');

  try {
    const r = await api('submitPayment', { courseId: cid, utr });
    if (r.ok) openCourse(cid); else msg('paymsg', r.error, false);

}

  if (fresh || !EXTRAS[chId]) {
    EXTRAS[chId] = api('getChapterExtras', { chapterId: chId })
      .then(r => { if (!r.ok) throw new Error(r.error); return r; })
      .catch(e => { delete EXTRAS[chId]; throw e; });
  }
  return EXTRAS[chId];
}

function openChapter(i, noScroll) {
  CUR_CH = i;
  const ch = CUR.chapters[i];
  document.querySelectorAll('.ch').forEach(el => el.classList.remove('active'));
  const el = $('ch' + i); if (el) el.classList.add('active');
  const tabs = [];
  if (ch.video) tabs.push(['video', '🎬 वीडियो']);
  if (ch.hasPdf) tabs.push(['pdf', '📄 नोट्स']);
  tabs.push(['hw', '📝 होमवर्क'], ['test', '✅ टेस्ट'], ['doubt', '💬 डाउट']);
  $('viewer').innerHTML = `<div class="card">
      <h3 style="margin-bottom:12px">${i + 1}. ${esc(ch.title)}</h3>
      <div class="ctabs">${tabs.map(t => `<button id="tab_${t[0]}" onclick="showPart('${t[0]}')">${t[1]}</button>`).join('')}</div>
      <div id="partArea"></div>
    </div>`;
  showPart(tabs[0][0]);
  // जिस चैप्टर में होमवर्क/टेस्ट नहीं है, उसके टैब छिपा दो
  loadExtras(ch.id).then(x => {
    if (CUR.chapters[CUR_CH] !== ch) return;
    if (!x.assignments.length && $('tab_hw') && !$('tab_hw').classList.contains('active')) $('tab_hw').classList.add('hidden');
    if (!x.questions.length && $('tab_test') && !$('tab_test').classList.contains('active')) $('tab_test').classList.add('hidden');
  }).catch(() => {});
  if (!noScroll) $('viewer').scrollIntoView({ behavior: 'smooth' });

async function showPart(which) {
  const ch = CUR.chapters[CUR_CH];
  document.querySelectorAll('.ctabs button').forEach(b => b.classList.toggle('active', b.id === 'tab_' + which));
  stopPlayer(); stopPdf();
  const area = $('partArea'); if (!area) return;
  if (which === 'video') { area.innerHTML = playerHtml(); makePlayer(ch.video); return; }
  if (which === 'pdf') {
    area.innerHTML = pdfHtml();
    openPdfData('ch_' + ch.id, async () => {
      const r = await api('getPdf', { chapterId: ch.id });
      if (!r.ok) throw new Error(r.error);
      return b64ToBytes(r.data);
    });
    return;
  }
  area.innerHTML = '<p class="muted">लोड हो रहा है...</p>';
  let x;
  try { x = await loadExtras(ch.id); } catch (e) { if ($('partArea')) $('partArea').innerHTML = `<p class="msg err">${esc(e.message)}</p>`; return; }
  if (CUR.chapters[CUR_CH] !== ch || !$('partArea') || !$('tab_' + which) || !$('tab_' + which).classList.contains('active')) return;
  $('partArea').innerHTML = which === 'hw' ? hwHtml(x) : which === 'test' ? testHtml(x) : doubtHtml(x);

async function reloadPart(which) {
  const ch = CUR.chapters[CUR_CH];

  await showPart(which);
}

// फ़ोटो को छोटा करके भेजना, ताकि अपलोड जल्दी हो
function fileToB64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
}
function compressImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1600; let w = img.naturalWidth, h = img.naturalHeight;
      const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.75).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('ये फ़ोटो नहीं खुल पाई, कोई दूसरी फ़ोटो चुनें')); };
    img.src = url;
  });
}
async function prepFiles(list) {
  const out = [];
  for (const f of Array.from(list).slice(0, 5)) {
    if (f.type === 'application/pdf') {
      if (f.size > 8 * 1024 * 1024) throw new Error('PDF 8 MB से छोटी होनी चाहिए');
      out.push({ mime: 'application/pdf', data: await fileToB64(f) });
    } else if (String(f.type).startsWith('image/')) {
      out.push({ mime: 'image/jpeg', data: await compressImage(f) });
    } else throw new Error('सिर्फ़ फ़ोटो या PDF चुनें');
  }
  return out;
}

async function sendHw(e, aid) {
  e.preventDefault();
  const inp = $('hwf_' + aid);
  if (!inp || !inp.files.length) return;
  const btn = e.submitter;
  if (btn) { btn.disabled = true; btn.textContent = 'फ़ाइलें तैयार हो रही हैं...'; }
  try {
    const files = await prepFiles(inp.files);
    if (btn) btn.textContent = 'भेजा जा रहा है...';
    const r = await api('submitHomework', { assignmentId: aid, files });
    if (!r.ok) throw new Error(r.error);
    await reloadPart('hw');
  } catch (err) {
    msg('hwmsg_' + aid, err.message, false);
    if (btn) { btn.disabled = false; btn.textContent = '📤 होमवर्क जमा करें'; }
  }
}

// ================= MCQ टेस्ट =================
function testHtml(x) {
  if (!x.questions.length) return '<p class="muted">इस चैप्टर में कोई टेस्ट नहीं है।</p>';
  if (x.canEdit) {
    return '<p class="muted" style="margin-bottom:10px">टीचर व्यू: सही जवाब हरे रंग में दिख रहा है</p>' +
      x.questions.map((q, i) => `<div class="q"><p class="qt">${i + 1}. ${esc(q.q)}</p>
        ${q.opts.map((o, j) => { const L = 'ABCD'[j]; return `<div class="opt ${L === q.correct ? 'right' : ''}">${L}. ${esc(o)}</div>`; }).join('')}
        ${q.exp ? `<p class="exp">💡 ${esc(q.exp)}</p>` : ''}</div>`).join('');
  }
  return `${x.best ? `<p class="msg ok" style="margin:0 0 12px">🏆 आपका सबसे अच्छा स्कोर: ${x.best.score} / ${x.best.total} (${x.best.tries} बार दिया)</p>` : ''}
    <div id="testScore"></div>
    <form onsubmit="sendTest(event)">
      ${x.questions.map((q, i) => `<div class="q" id="q_${q.id}"><p class="qt">${i + 1}. ${esc(q.q)}</p>
        ${q.opts.map((o, j) => { const L = 'ABCD'[j]; return `<label class="opt" data-l="${L}"><input type="radio" name="${q.id}" value="${L}"> ${L}. ${esc(o)}</label>`; }).join('')}
        <p class="exp hidden"></p></div>`).join('')}
      <button class="btn full" type="submit" id="testBtn">टेस्ट जमा करें</button>
    </form>`;
}

async function sendTest(e) {
  e.preventDefault();
  const ch = CUR.chapters[CUR_CH];
  try {
    const x = await loadExtras(ch.id);
    const answers = {}; let blank = 0;
    x.questions.forEach(q => { const el = document.querySelector(`input[name="${q.id}"]:checked`); if (el) answers[q.id] = el.value; else blank++; });
    if (blank && !confirm(blank + ' सवाल छूट गए हैं। फिर भी जमा करें?')) return;
    const r = await api('submitTest', { chapterId: ch.id, answers });
    if (!r.ok) return alert(r.error);
    r.results.forEach(res => {
      const box = $('q_' + res.id); if (!box) return;
      box.querySelectorAll('input').forEach(i => i.disabled = true);
      box.querySelectorAll('.opt').forEach(o => {
        if (o.dataset.l === res.correct) o.classList.add('right');
        else if (o.dataset.l === res.given) o.classList.add('wrong');
      });
      if (res.exp) { const p = box.querySelector('.exp'); p.textContent = '💡 ' + res.exp; p.classList.remove('hidden'); }
    });
    const pct = Math.round(r.score / r.total * 100);
    $('testScore').innerHTML = `<div class="score"><div class="big">${r.score} / ${r.total}</div>
      <div>${pct}% • ${pct >= 80 ? '🎉 शानदार!' : pct >= 50 ? '👍 अच्छा है' : '📖 थोड़ा और पढ़ें'}</div></div>`;
    $('testBtn').outerHTML = `<button class="btn gray full" type="button" onclick="reloadPart('test')">🔁 फिर से दें</button>`;
    delete EXTRAS[ch.id];
    $('testScore').scrollIntoView({ behavior: 'smooth' });
  } catch (err) { fail(err); }
}

function doubtHtml(x) {

// ================= फ़ुल स्क्रीन =================
function toggleFs(el, onChange) {
  if (!el) return;
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (el.classList.contains('fs')) { el.classList.remove('fs'); document.body.style.overflow = ''; onChange && onChange(); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const fallback = () => { el.classList.add('fs'); document.body.style.overflow = 'hidden'; onChange && onChange(); };
  if (req) {
    try { const p = req.call(el); if (p && p.catch) p.catch(fallback); } catch (e) { fallback(); }
  } else fallback();
}

let YTP = null, YT_TICK = null, IDLE_T = null, ytReady = null;

function loadYT() {

  ytReady = new Promise(res => {

  });

}

function playerHtml() {

const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };

async function makePlayer(videoId) {
  await loadYT();
  if (!$('ytHost')) return;
  YTP = new YT.Player('ytHost', {
    videoId,
    host: 'https://www.youtube-nocookie.com',
    playerVars: { controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, playsinline: 1 },
    events: { onStateChange: onYTState }
  });
  const vp = $('vp'), seek = $('vpSeek');
  const toggle = () => { if (!YTP || !YTP.getPlayerState) return; YTP.getPlayerState() === 1 ? YTP.pauseVideo() : YTP.playVideo(); };
  $('vpShield').onclick = () => { toggle(); wake(); };
  $('vpPlay').onclick = toggle;
  $('vpBack').onclick = () => YTP && YTP.seekTo(Math.max(0, YTP.getCurrentTime() - 10), true);
  $('vpFwd').onclick  = () => YTP && YTP.seekTo(YTP.getCurrentTime() + 10, true);
  $('vpMute').onclick = () => { if (!YTP) return;
    if (YTP.isMuted()) { YTP.unMute(); $('vpMute').textContent = '🔊'; } else { YTP.mute(); $('vpMute').textContent = '🔇'; } };
  $('vpSpeed').onchange = e => YTP && YTP.setPlaybackRate(Number(e.target.value));
  $('vpFs').onclick = () => toggleFs($('vp'));
  let dragging = false;
  seek.oninput = () => { dragging = true; const d = YTP && YTP.getDuration ? YTP.getDuration() : 0;
    $('vpTime').textContent = fmt(d * seek.value / 1000) + ' / ' + fmt(d); };
  seek.onchange = () => { const d = YTP.getDuration(); YTP.seekTo(d * seek.value / 1000, true); dragging = false; };
  vp.onmousemove = wake; vp.ontouchstart = wake;
  YT_TICK = setInterval(() => {
    if (!YTP || !YTP.getDuration || !$('vpSeek')) return;
    const d = YTP.getDuration() || 0, t = YTP.getCurrentTime() || 0;
    if (!dragging && d) { seek.value = Math.round(t / d * 1000); $('vpTime').textContent = fmt(t) + ' / ' + fmt(d); }
  }, 500);
}

function onYTState(e) {
  const playing = e.data === 1;
  if ($('vpPlay')) $('vpPlay').textContent = playing ? '⏸' : '▶';
  if ($('vpCover')) $('vpCover').classList.toggle('gone', playing || e.data === 3);
  if (e.data === 0 && $('vpCover')) $('vpCover').innerHTML = '<div class="bigplay">↺</div>';
  wake();
}

function wake() {
  const vp = $('vp'); if (!vp) return;
  vp.classList.remove('idle');
  clearTimeout(IDLE_T);
  IDLE_T = setTimeout(() => { if (YTP && YTP.getPlayerState && YTP.getPlayerState() === 1 && $('vp')) $('vp').classList.add('idle'); }, 3000);
}

function stopPlayer() {
  clearInterval(YT_TICK); clearTimeout(IDLE_T);
  if (YTP && YTP.destroy) { try { YTP.destroy(); } catch (e) {} }
  YTP = null;
}

// ================= अपना PDF व्यूअर (स्मूथ) =================
const PDF_CACHE = {};
let PDFDOC = null, PDF_ZOOM = 1, PDF_TOKEN = 0, PDF_RESIZE_T = null, PDF_OBS = null, PDF_W = 0;

function b64ToBytes(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function pdfHtml() {
  return `<div class="pv" id="pv">
    <div class="pbar">
      <button onclick="pdfZoom(-0.25)">−</button>
      <button onclick="pdfZoom(0.25)">+</button>
      <span class="pinfo" id="pvInfo">लोड हो रहा है...</span>
      <span class="sp2"></span>
      <button onclick="toggleFs($('pv'), renderPdf)">⛶</button>
    </div>
    <div class="pages" id="pvPages"><div class="pmsg">लोड हो रहा है...</div></div>
  </div>`;
}

async function openPdfData(key, loader) {
  const my = ++PDF_TOKEN;
  PDF_ZOOM = 1;
  if (!window.pdfjsLib) { if ($('pvPages')) $('pvPages').innerHTML = '<div class="pmsg">PDF व्यूअर लोड नहीं हुआ। पेज रिफ़्रेश करें।</div>'; return; }
  try {
    let bytes = PDF_CACHE[key];
    if (!bytes) { bytes = await loader(); if (my !== PDF_TOKEN) return; PDF_CACHE[key] = bytes; }
    const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    if (my !== PDF_TOKEN) { try { doc.destroy(); } catch (e) {} return; }
    PDFDOC = doc;
    await renderPdf();
    if ($('pvPages')) $('pvPages').onscroll = updatePageNo;
  } catch (e) {
    if (my === PDF_TOKEN && $('pvPages')) $('pvPages').innerHTML = `<div class="pmsg">${esc(e.message || 'फ़ाइल नहीं खुल पाई')}</div>`;
  }
}

// सारे पन्नों की खाली जगह बनाओ, असली पन्ना तभी बनाओ जब वो स्क्रीन के पास आए
async function renderPdf() {
  if (!PDFDOC || !$('pvPages')) return;
  const my = PDF_TOKEN, doc = PDFDOC, box = $('pvPages');
  const ratio = box.scrollHeight > box.clientHeight ? box.scrollTop / box.scrollHeight : 0;
  if (PDF_OBS) PDF_OBS.disconnect();
  PDF_W = box.clientWidth - 16;
  const first = await doc.getPage(1);
  if (my !== PDF_TOKEN || !$('pvPages')) return;
  const b = first.getViewport({ scale: 1 });
  const w = PDF_W * PDF_ZOOM, h = w * b.height / b.width;
  box.innerHTML = '';
  for (let n = 1; n <= doc.numPages; n++) {
    const d = document.createElement('div');
    d.className = 'pg'; d.dataset.page = n;
    d.style.width = w + 'px'; d.style.height = h + 'px';
    box.appendChild(d);
  }
  box.scrollTop = ratio * box.scrollHeight;
  PDF_OBS = new IntersectionObserver(ents => ents.forEach(en => {
    if (en.isIntersecting && !en.target.dataset.done) drawPage(en.target, my, doc);
  }), { root: box, rootMargin: '800px 0px' });
  box.querySelectorAll('.pg').forEach(d => PDF_OBS.observe(d));
  updatePageNo();
}

async function drawPage(div, my, doc) {
  div.dataset.done = '1';
  try {
    const page = await doc.getPage(+div.dataset.page);
    if (my !== PDF_TOKEN || !div.isConnected) return;
    const base = page.getViewport({ scale: 1 });
    const scale = (PDF_W / base.width) * PDF_ZOOM;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vp = page.getViewport({ scale: scale * dpr });
    const cv = document.createElement('canvas');
    cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    div.style.width = (vp.width / dpr) + 'px'; div.style.height = (vp.height / dpr) + 'px';
    div.appendChild(cv);
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  } catch (e) { div.dataset.done = ''; }
}

function updatePageNo() {
  const box = $('pvPages'); if (!box || !PDFDOC || !$('pvInfo')) return;
  let cur = 1; const top = box.scrollTop + box.clientHeight / 3;
  for (const d of box.querySelectorAll('.pg')) { if (d.offsetTop <= top) cur = +d.dataset.page; else break; }
  $('pvInfo').textContent = `पेज ${cur} / ${PDFDOC.numPages}`;
}

function pdfZoom(d) {
  PDF_ZOOM = Math.min(3, Math.max(0.5, PDF_ZOOM + d));
  renderPdf();
}

function stopPdf() {
  PDF_TOKEN++;
  if (PDF_OBS) { PDF_OBS.disconnect(); PDF_OBS = null; }
  if (PDFDOC) { try { PDFDOC.destroy(); } catch (e) {} }
  PDFDOC = null;
}

function refitPdf() { clearTimeout(PDF_RESIZE_T); PDF_RESIZE_T = setTimeout(renderPdf, 300); }
window.addEventListener('resize', refitPdf);
document.addEventListener('fullscreenchange', refitPdf);
document.addEventListener('webkitfullscreenchange', refitPdf);

      <details style="margin-top:12px" open><summary>➕ नया सवाल जोड़ें</summary>
        <form onsubmit="addQ(event,'${chid}','${cid}')">
          <label>सवाल *</label><textarea id="qText" required></textarea>
          ${['A', 'B', 'C', 'D'].map(L => `<label>विकल्प ${L} *</label><input id="qOpt${L}" required>`).join('')}
          <label>सही विकल्प *</label>
          <select id="qRight"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
          <label>समझाइए (ज़रूरी नहीं, टेस्ट के बाद दिखेगा)</label><textarea id="qExp"></textarea>
          <button class="btn full" type="submit">सवाल जोड़ें</button>
        </form><div id="qmsg"></div>
      </details>
    </div>`);
}

async function addAsg(e, chid, cid) {
  e.preventDefault();
  try {
    const r = await api('addAssignment', { chapterId: chid, title: $('aTitle').value, instructions: $('aInst').value,
                                           maxMarks: $('aMax').value, due: $('aDue').value });
    if (r.ok) chapterManage(chid, cid); else msg('asgmsg', r.error, false);
  } catch (err) { msg('asgmsg', err.message, false); }
}

async function delAsg(id, chid, cid) {
  if (!confirm('ये होमवर्क हटाना है?')) return;
  try {
    const r = await api('deleteAssignment', { assignmentId: id });
    if (r.ok) chapterManage(chid, cid); else alert(r.error);
  } catch (e) { fail(e); }
}

async function addQ(e, chid, cid) {
  e.preventDefault();
  try {
    const r = await api('addQuestion', { chapterId: chid, question: $('qText').value,
      options: ['A', 'B', 'C', 'D'].map(L => $('qOpt' + L).value), correct: $('qRight').value, explanation: $('qExp').value });
    if (r.ok) chapterManage(chid, cid); else msg('qmsg', r.error, false);
  } catch (err) { msg('qmsg', err.message, false); }
}

async function delQ(id, chid, cid) {
  if (!confirm('ये सवाल हटाना है?')) return;
  try {
    const r = await api('deleteQuestion', { questionId: id });
    if (r.ok) chapterManage(chid, cid); else alert(r.error);
  } catch (e) { fail(e); }
}

// ================= टीचर: चेक करना बाकी =================
let INBOX = null;
async function inbox() {
  let r;
  try { r = await api('teacherInbox'); } catch (e) { return fail(e); }
  if (!r.ok) return alert(r.error);
  INBOX = r;
  app(`${backBtn()}<h2>📥 चेक करना बाकी</h2>
    <div class="card"><h3>📝 होमवर्क (${r.homework.length})</h3>
      ${r.homework.map(h => `<div class="row"><span><b>${esc(h.student)}</b> — ${esc(h.assignment)}<br>
          <span class="muted">${esc(h.course)} • ${esc(h.chapter)} • ${esc(h.at)}</span></span>
        <button class="btn sm" onclick="gradeView('${h.id}')">चेक करें</button></div>`).join('') || '<p class="muted">कोई होमवर्क बाकी नहीं। 🎉</p>'}
    </div>
    <div class="card"><h3>💬 डाउट (${r.doubts.length})</h3>
      ${r.doubts.map(d => `<div class="doubt">
          <p><b>${esc(d.by)}</b> <span class="muted">${esc(d.course)} • ${esc(d.chapter)} • ${esc(d.at)}</span></p>
          <p style="white-space:pre-line">❓ ${esc(d.q)}</p>
          <form onsubmit="sendAnswer(event,'${d.id}',false)"><textarea id="ans_${d.id}" placeholder="जवाब लिखें" required></textarea>
            <button class="btn sm" type="submit" style="margin-top:6px">जवाब भेजें</button></form>
        </div>`).join('') || '<p class="muted">कोई डाउट बाकी नहीं। 🎉</p>'}
    </div>`);
}

function gradeView(id) {
  const h = INBOX && INBOX.homework.find(x => x.id === id); if (!h) return;
  app(`${backBtn('inbox()')}
    <div class="card"><h2>${esc(h.assignment)}</h2>
      <p class="muted">${esc(h.student)} • ${esc(h.course)} • ${esc(h.chapter)} • ${esc(h.at)}</p>
      ${h.instructions ? `<p style="white-space:pre-line;margin-top:8px">${esc(h.instructions)}</p>` : ''}
      <div style="margin-top:10px">${fileBtns(h.files, 'कॉपी')}</div>
      <div id="fileView"></div>
    </div>
    <div class="card"><h3>नंबर और कमेंट</h3>
      <form onsubmit="sendGrade(event,'${h.id}')">
        <label>नंबर * ${h.maxMarks ? '(कुल ' + h.maxMarks + ')' : ''}</label>
        <input id="gMarks" type="number" min="0" ${h.maxMarks ? `max="${h.maxMarks}"` : ''} step="0.5" required>
        <label>कमेंट / सुधार</label><textarea id="gFb" placeholder="जैसे: सवाल 3 में गलती है..."></textarea>
        <label>चेक की हुई कॉपी की फ़ोटो (ज़रूरी नहीं)</label><input id="gFile" type="file" accept="image/*,application/pdf">
        <button class="btn green full" type="submit">✅ चेक पूरा करें</button>
      </form><div id="gmsg"></div>
    </div>`);
  if (h.files[0]) viewFile(h.files[0]);
}

async function sendGrade(e, id) {
  e.preventDefault();
  const btn = e.submitter; if (btn) btn.disabled = true;
  try {
    let file = null;
    const f = $('gFile').files;
    if (f.length) file = (await prepFiles(f))[0];
    const r = await api('gradeSubmission', { submissionId: id, marks: $('gMarks').value, feedback: $('gFb').value, file });
    if (!r.ok) throw new Error(r.error);
    alert('चेक हो गया! स्टूडेंट को नंबर दिख जाएँगे।');
    inbox();
  } catch (err) { msg('gmsg', err.message, false); if (btn) btn.disabled = false; }
}

// ================= एडमिन =================
function teacherForm() {
  app(`${backBtn()}<div class="card narrow" style="max-width:500px">
    <h2>नया टीचर जोड़ें</h2>
    <form onsubmit="createTeacher(event)">
      <label>नाम *</label><input id="tName" required>
      <label>ईमेल *</label><input id="tEmail" type="email" required>
      <label>मोबाइल</label><input id="tPhone" type="tel">
      <label>पासवर्ड * (कम से कम 6 अक्षर)</label><input id="tPass" minlength="6" required>
      <button class="btn full" type="submit">टीचर अकाउंट बनाएँ</button>
    </form><div id="tmsg"></div></div>`);
}

async function createTeacher(e) {
  e.preventDefault();
  try {
    const r = await api('createTeacher', { name: $('tName').value, email: $('tEmail').value, phone: $('tPhone').value, password: $('tPass').value });
    if (r.ok) { msg('tmsg', 'टीचर अकाउंट बन गया! ईमेल और पासवर्ड टीचर को भेज दें।', true); e.target.reset(); }
    else msg('tmsg', r.error, false);
  } catch (err) { msg('tmsg', err.message, false); }
}

async function pendingCourses() {
  let r;
  try { r = await api('adminPending'); } catch (e) { return fail(e); }
  if (!r.ok) return alert(r.error);
  app(`${backBtn()}<h2>मंज़ूरी के लिए कोर्स</h2>
    <div class="card">${r.courses.map(c => `<div class="row">
      <span><b>${esc(c.title)}</b><br><span class="muted">${esc(c.teacher)} • ${c.chapters} चैप्टर • ${c.price > 0 ? '₹' + c.price : 'फ्री'}</span></span>
      <span style="white-space:nowrap">
        <button class="btn sm" onclick="openCourse('${c.id}')">देखें</button>
        <button class="btn green sm" onclick="setStatus('${c.id}','published')">मंज़ूर</button>
        <button class="btn red sm" onclick="setStatus('${c.id}','rejected')">रिजेक्ट</button>
      </span></div>`).join('') || '<p class="muted">कोई कोर्स मंज़ूरी के लिए नहीं है।</p>'}</div>`);
}

async function setStatus(cid, status) {
  if (!confirm(status === 'published' ? 'ये कोर्स पब्लिश करना है?' : 'ये कोर्स रिजेक्ट करना है?')) return;
  try {
    const r = await api('setCourseStatus', { courseId: cid, status });
    if (r.ok) pendingCourses(); else alert(r.error);
  } catch (e) { fail(e); }
}

// ================= शुरुआत =================
(async () => {
  if (!localStorage.getItem('token')) return authView();
  try {
    const r = await api('me');
    if (r.ok) { USER = r.user; home(); } else authView();
  } catch (e) { if (!USER) authView(); }
})();
</script>
