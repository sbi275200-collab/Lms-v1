<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo LMS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  body{background:#f1f5f9;color:#1e293b;min-height:100vh}
  header{background:#2563eb;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
  header h1{font-size:20px;cursor:pointer}
  header button{background:#fff;color:#2563eb;border:0;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
  main{max-width:960px;margin:24px auto;padding:0 16px}
  .narrow{max-width:420px;margin:16px auto}
  .card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:16px}
  .tabs{display:flex;margin-bottom:18px;border-bottom:2px solid #e2e8f0}
  .tabs button{flex:1;background:none;border:0;padding:10px;font-size:16px;cursor:pointer;color:#64748b}
  .tabs button.active{color:#2563eb;border-bottom:3px solid #2563eb;font-weight:600}
  label{display:block;font-size:14px;margin:12px 0 4px;color:#475569}
  input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
  textarea{min-height:80px;resize:vertical}
  .btn{display:inline-block;margin-top:16px;padding:11px 18px;background:#2563eb;color:#fff;border:0;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
  .btn.full{width:100%;text-align:center}
  .btn.green{background:#16a34a}.btn.red{background:#dc2626}.btn.gray{background:#64748b}
  .btn.sm{padding:7px 12px;font-size:13px;margin-top:0}
  .back{background:none;border:0;color:#2563eb;font-size:15px;cursor:pointer;margin-bottom:12px}
  .msg{margin-top:14px;padding:10px;border-radius:8px;font-size:14px}
  .msg.err{background:#fee2e2;color:#b91c1c}
  .msg.ok{background:#dcfce7;color:#166534}
  .msg.wait{background:#fef9c3;color:#854d0e}
  .hidden{display:none!important}
  .badge{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:3px 10px;border-radius:20px;font-size:12px;margin-left:6px;vertical-align:middle}
  .badge.draft{background:#f1f5f9;color:#475569}.badge.pending{background:#fef9c3;color:#854d0e}
  .badge.published{background:#dcfce7;color:#166534}.badge.rejected{background:#fee2e2;color:#b91c1c}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:16px}
  .tile{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;transition:transform .1s}
  .tile:hover{transform:translateY(-2px)}
  .tile.off{opacity:.55;cursor:default}
  .tile h3{font-size:16px;margin-bottom:6px}
  .tile p{font-size:14px;color:#64748b}
  .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#e2e8f0;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:36px}
  .price{font-weight:700;color:#16a34a}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #e2e8f0}
  .row:last-child{border-bottom:0}
  .ch{cursor:pointer;padding:12px 10px;border-radius:8px}
  .ch:hover{background:#f8fafc}
  .ch.active{color:#2563eb;font-weight:600;background:#eff6ff}
  h2{margin-bottom:6px}
  .muted{color:#64748b;font-size:14px}
  .loader{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#2563eb,#60a5fa,#2563eb);background-size:200% 100%;animation:ld 1s linear infinite;z-index:200}
  @keyframes ld{to{background-position:-200% 0}}

  /* पेमेंट */
  .paybox{border:2px dashed #cbd5e1;border-radius:14px;padding:18px;margin-top:16px;text-align:center}
  .paybox h3{font-size:16px;margin-bottom:4px}
  .step{display:inline-block;background:#2563eb;color:#fff;width:24px;height:24px;border-radius:50%;font-size:13px;line-height:24px;margin-right:6px}
  #qr{display:flex;justify-content:center;margin:14px 0}
  #qr img,#qr canvas{background:#fff;padding:8px;border-radius:8px;border:1px solid #e2e8f0}
  .upiline{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:15px}
  .upiline code{background:#f1f5f9;padding:6px 10px;border-radius:6px;font-size:15px}
  .bigamt{font-size:28px;font-weight:800;color:#16a34a;margin:4px 0}
  .utr{font-size:20px;letter-spacing:2px;text-align:center}
  .paycard{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:12px}
  .paycard .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .paycard .utrbig{font-family:monospace;font-size:18px;font-weight:700;letter-spacing:1px;background:#f1f5f9;padding:6px 10px;border-radius:6px;display:inline-block;margin:8px 0}

  /* चैप्टर टैब */
  .ctabs{display:flex;gap:8px;margin-bottom:14px}
  .ctabs button{flex:1;padding:11px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;font-size:15px;cursor:pointer;color:#475569}
  .ctabs button.active{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:600}

  /* वीडियो प्लेयर */
  .vp{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;user-select:none;-webkit-user-select:none}
  .vp .yt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .vp .yt iframe{width:100%;height:100%;border:0;pointer-events:none}
  .vp .shield{position:absolute;inset:0;z-index:3;cursor:pointer;background:transparent}
  .vp .cover{position:absolute;inset:0;z-index:2;background:#0f172a;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
  .vp .cover.gone{opacity:0;pointer-events:none}
  .vp .bigplay{width:72px;height:72px;border-radius:50%;background:rgba(37,99,235,.95);display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;padding-left:5px}
  .vp .bar{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:8px 10px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;transition:opacity .25s}
  .vp.idle .bar{opacity:0}
  .vp .seek{width:100%;height:4px;padding:0;margin:0 0 6px;accent-color:#3b82f6;cursor:pointer;border:0}
  .vp .ctrls{display:flex;align-items:center;gap:6px}
  .vp .ctrls button{background:none;border:0;color:#fff;font-size:18px;padding:6px 8px;cursor:pointer;border-radius:6px;min-width:36px}
  .vp .time{font-size:13px;margin-left:4px;white-space:nowrap}
  .vp .sp{margin-left:auto;width:auto;padding:4px 6px;font-size:13px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px}
  .vp .sp option{color:#000}
  .vp.fs,.vp:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
  .vp.fs{position:fixed;inset:0;z-index:100}

  /* अपना PDF व्यूअर */
  .pv{display:flex;flex-direction:column;height:80vh;height:80dvh;background:#525659;border-radius:12px;overflow:hidden;user-select:none;-webkit-user-select:none}
  .pv .pbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#1e293b;color:#fff;flex-shrink:0}
  .pv .pbar button{background:rgba(255,255,255,.12);border:0;color:#fff;font-size:17px;width:38px;height:34px;border-radius:8px;cursor:pointer}
  .pv .pbar .pinfo{font-size:14px;margin:0 6px;white-space:nowrap}
  .pv .pbar .sp2{flex:1}
  .pv .pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 0;touch-action:pan-x pan-y}
  .pv .pages canvas{display:block;margin:0 auto 10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .pv .pmsg{color:#fff;text-align:center;padding:40px 16px;font-size:15px}
  .pv.fs,.pv:fullscreen{border-radius:0;width:100vw;height:100vh;height:100dvh}
  .pv.fs{position:fixed;inset:0;z-index:100}
  @media print{body{display:none}}
</style>
</head>
<body oncontextmenu="return false">

<header>
  <h1 id="siteName" onclick="if(USER)home()">Demo LMS</h1>
  <button id="logoutBtn" class="hidden" onclick="logout()">लॉगआउट</button>
</header>
<main id="app"></main>
<div id="loader" class="loader hidden"></div>

<script>
// ===== सेटिंग =====
const API = "https://script.google.com/macros/s/AKfycbxmOfi8cXdPta-ITlweWlUuIycmLrQ8ZESLwFBuGaWj1EXTCT-rTdm6DKDndJ4mnsqR/exec";
const SITE_NAME = "Demo LMS";
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let USER = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = html => { stopPlayer(); stopPdf(); $('app').innerHTML = html; window.scrollTo(0, 0); };
const statusName = { draft:'ड्राफ़्ट', pending:'मंज़ूरी बाकी', published:'पब्लिश', rejected:'रिजेक्ट' };
$('siteName').textContent = SITE_NAME; document.title = SITE_NAME;

let busy = 0;
async function api(action, data = {}) {
  busy++; $('loader').classList.remove('hidden');
  try {
    const res = await fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action, token: localStorage.getItem('token'), ...data }) });
    const r = await res.json();
    if (r.relogin) { localStorage.removeItem('token'); USER = null; authView('दोबारा लॉगिन करें'); throw new Error('relogin'); }
    return r;
  } catch (e) {
    if (e.message !== 'relogin') alert('नेटवर्क में दिक्कत है, फिर से कोशिश करें');
    throw e;
  } finally { if (--busy <= 0) { busy = 0; $('loader').classList.add('hidden'); } }
}

function msg(id, text, ok) { const m = $(id); if (m) { m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = text; } }
const backBtn = (fn = 'home()') => `<button class="back" onclick="${fn}">← वापस</button>`;

async function copyText(t, btn) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = '✓ कॉपी हुआ'; setTimeout(() => btn.textContent = o, 1500); }
}

// ================= लॉगिन / साइन-अप =================
function authView(note) {
  $('logoutBtn').classList.add('hidden');
  app(`<div class="narrow card">
    <div class="tabs">
      <button id="tLogin" class="active" onclick="showTab('login')">लॉगिन</button>
      <button id="tSignup" onclick="showTab('signup')">नया अकाउंट</button>
    </div>
    <form id="loginForm" onsubmit="doLogin(event)">
      <label>ईमेल</label><input id="lEmail" type="email" required>
      <label>पासवर्ड</label><input id="lPass" type="password" required>
      <button class="btn full" type="submit">लॉगिन करें</button>
      <p class="muted" style="margin-top:12px">पासवर्ड भूल गए? एडमिन से संपर्क करें।</p>
    </form>
    <form id="signupForm" class="hidden" onsubmit="doSignup(event)">
      <label>पूरा नाम</label><input id="sName" required>
      <label>ईमेल</label><input id="sEmail" type="email" required>
      <label>मोबाइल नंबर</label><input id="sPhone" type="tel">
      <label>पासवर्ड (कम से कम 6 अक्षर)</label><input id="sPass" type="password" minlength="6" required>
      <button class="btn full" type="submit">अकाउंट बनाएँ</button>
    </form>
    <div id="amsg"></div>
  </div>`);
  if (note) msg('amsg', note, false);
}

function showTab(t) {
  $('loginForm').classList.toggle('hidden', t !== 'login');
  $('signupForm').classList.toggle('hidden', t !== 'signup');
  $('tLogin').classList.toggle('active', t === 'login');
  $('tSignup').classList.toggle('active', t === 'signup');
  $('amsg').className = ''; $('amsg').textContent = '';
}

async function doLogin(e) {
  e.preventDefault();
  const r = await api('login', { email: $('lEmail').value, password: $('lPass').value });
  if (r.ok) { localStorage.setItem('token', r.token); USER = r.user; home(); }
  else msg('amsg', r.error, false);
}

async function doSignup(e) {
  e.preventDefault();
  const email = $('sEmail').value;
  const r = await api('signup', { name: $('sName').value, email, phone: $('sPhone').value, password: $('sPass').value });
  if (r.ok) { showTab('login'); $('lEmail').value = email; msg('amsg', 'अकाउंट बन गया! अब लॉगिन करें।', true); }
  else msg('amsg', r.error, false);
}

async function logout() {
  const token = localStorage.getItem('token');
  localStorage.removeItem('token'); USER = null;
  if (token) fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'logout', token }) }).catch(()=>{});
  authView();
}

// ================= होम =================
function home() {
  $('logoutBtn').classList.remove('hidden');
  const roles = { student:'स्टूडेंट', teacher:'टीचर', admin:'एडमिन' };
  const tiles = {
    student: [['📚 मेरे कोर्स','जो कोर्स आपने शुरू किए','myCourses()'], ['🔍 सभी कोर्स देखें','नए कोर्स खोजें','allCourses()']],
    teacher: [['📚 मेरे कोर्स','अपने कोर्स देखें और एडिट करें','teacherCourses()'], ['➕ नया कोर्स बनाएँ','नया कोर्स शुरू करें','courseForm()']],
    admin:   [['💰 पेमेंट वेरीफाई','स्टूडेंट के UPI पेमेंट चेक करें','adminPayments()'], ['✅ कोर्स मंज़ूरी','टीचर के भेजे कोर्स चेक करें','pendingCourses()'],
              ['👩‍🏫 टीचर जोड़ें','नया टीचर अकाउंट बनाएँ','teacherForm()'], ['🔍 सभी कोर्स','पब्लिश हुए कोर्स देखें','allCourses()'],
              ['➕ अपना कोर्स बनाएँ','एडमिन भी कोर्स बना सकता है','courseForm()'], ['📚 मेरे बनाए कोर्स','','teacherCourses()']]
  }[USER.role] || [];
  app(`<h2>नमस्ते, ${esc(USER.name)} <span class="badge">${roles[USER.role] || USER.role}</span></h2>
    <div class="grid">${tiles.map(t => `<div class="tile ${t[2] ? '' : 'off'}" ${t[2] ? `onclick="${t[2]}"` : ''}><h3>${t[0]}</h3><p>${t[1]}</p></div>`).join('')}</div>`);
}

// ================= कोर्स कार्ड =================
function cardHtml(c, onclick, showStatus) {
  const thumb = c.thumb ? `<img class="thumb" src="${esc(c.thumb)}" alt="">` : `<div class="thumb">📘</div>`;
  return `<div class="tile" onclick="${onclick}">${thumb}
    <h3>${esc(c.title)} ${showStatus ? `<span class="badge ${esc(c.status)}">${statusName[c.status] || esc(c.status)}</span>` : ''}</h3>
    <p>${esc(c.teacher)}${c.subject ? ' • ' + esc(c.subject) : ''} • ${c.chapters} चैप्टर</p>
    <p class="price">${c.price > 0 ? '₹' + c.price : 'फ्री'}</p></div>`;
}

async function allCourses() {
  const r = await api('listCourses'); if (!r.ok) return alert(r.error);
  app(`${backBtn()}<h2>सभी कोर्स</h2>
    ${r.courses.length ? `<div class="grid">${r.courses.map(c => cardHtml(c, `openCourse('${c.id}')`)).join('')}</div>`
                       : '<p class="muted">अभी कोई कोर्स पब्लिश नहीं हुआ है।</p>'}`);
}

async function myCourses() {
  const r = await api('myEnrollments'); if (!r.ok) return alert(r.error);
  app(`${backBtn()}<h2>मेरे कोर्स</h2>
    ${r.courses.length ? `<div class="grid">${r.courses.map(c => cardHtml(c, `openCourse('${c.id}')`)).join('')}</div>`
                       : '<p class="muted">आपने अभी कोई कोर्स शुरू नहीं किया। <a href="#" onclick="allCourses();return false">कोर्स देखें</a></p>'}`);
}

// ================= कोर्स पेज =================
let CUR = null, CUR_CH = 0;
async function openCourse(id) {
  const r = await api('getCourse', { courseId: id }); if (!r.ok) return alert(r.error);
  CUR = r;
 if (!r.pay || !r.pay.upi) r.pay = { upi: '8949536974-2@ibl', name: 'SOURAV BHATI' };
  const c = r.course;
  let action = '';
  if (!r.access && r.role === 'student') {
    action = c.price === 0 ? `<button class="btn green" onclick="enroll('${c.id}')">फ्री में शुरू करें</button>` : payBox(r);
  }
  app(`${backBtn()}
    <div class="card">
      <h2>${esc(c.title)} ${r.canEdit ? `<span class="badge ${esc(c.status)}">${statusName[c.status] || ''}</span>` : ''}</h2>
      <p class="muted">${esc(c.teacher)}${c.subject ? ' • ' + esc(c.subject) : ''} • <span class="price">${c.price > 0 ? '₹' + c.price : 'फ्री'}</span></p>
      ${c.description ? `<p style="margin-top:10px;white-space:pre-line">${esc(c.description)}</p>` : ''}
      ${action}
      ${r.canEdit ? `<button class="btn gray" onclick="courseEditor('${c.id}')">✏️ एडिट करें</button>` : ''}
    </div>
    <div id="viewer"></div>
    <div class="card"><h3 style="margin-bottom:6px">चैप्टर</h3>
      ${r.chapters.length ? r.chapters.map((ch, i) => `<div class="row ch" id="ch${i}" onclick="${r.access ? `openChapter(${i})` : ''}">
          <span>${r.access ? '▶️' : '🔒'} ${i + 1}. ${esc(ch.title)}</span>
          <span class="muted">${ch.hasVideo ? '🎬' : ''} ${ch.hasPdf ? '📄' : ''}</span></div>`).join('')
        : '<p class="muted">अभी कोई चैप्टर नहीं है।</p>'}
    </div>`);
  if (r.access && r.chapters.length) openChapter(0, true);
}

async function enroll(id) {
  const r = await api('enrollFree', { courseId: id });
  if (r.ok) openCourse(id); else alert(r.error);
}

// ================= UPI पेमेंट (स्टूडेंट) =================
function upiLink(r) {
  const c = r.course, p = r.pay;
  return 'upi://pay?pa=' + encodeURIComponent(p.upi) + '&pn=' + encodeURIComponent(p.name) +
         '&am=' + c.price + '&cu=INR&tn=' + encodeURIComponent(String(c.title).slice(0, 40));
}

function payBox(r) {
  const c = r.course, p = r.payment;
  if (p && p.status === 'pending')
    return `<div class="msg wait">⏳ आपका पेमेंट (UTR: ${esc(p.utr)}) जाँच में है। मंज़ूरी मिलते ही ये कोर्स "मेरे कोर्स" में खुल जाएगा।</div>`;
  if (!r.pay || !r.pay.upi) return '<p class="msg err">पेमेंट की जानकारी अभी सेट नहीं है, एडमिन से संपर्क करें।</p>';
  const warn = p && p.status === 'rejected'
    ? `<div class="msg err">आपका पिछला पेमेंट (UTR: ${esc(p.utr)}) मंज़ूर नहीं हुआ। सही UTR डालकर फिर से भेजें, या एडमिन से संपर्क करें।</div>` : '';
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  return `${warn}
    <button class="btn green" id="buyBtn" onclick="showPay()">₹${c.price} में खरीदें</button>
    <div id="payArea" class="hidden">
      <div class="paybox">
        <h3><span class="step">1</span>पेमेंट करें</h3>
        <div class="bigamt">₹${c.price}</div>
        ${isMobile ? `<a class="btn green full" href="${esc(upiLink(r))}">📱 UPI ऐप से पे करें</a>

function toggleFs(el, onChange) {
  if (!el) return;
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (el.classList.contains('fs')) { el.classList.remove('fs'); document.body.style.overflow = ''; onChange && onChange(); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  const fallback = () => { el.classList.add('fs'); document.body.style.overflow = 'hidden'; onChange && onChange(); };
  if (req) {
    try { const p = req.call(el); if (p && p.catch) p.catch(fallback); } catch (e) { fallback(); }
  } else fallback();
}

let YTP = null, YT_TICK = null, IDLE_T = null, ytReady = null;

function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise(res => {
    if (window.YT && YT.Player) return res();
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  });
  return ytReady;
}

function playerHtml() {
  return `<div class="vp" id="vp">
    <div class="yt"><div id="ytHost"></div></div>
    <div class="cover" id="vpCover"><div class="bigplay">▶</div></div>
    <div class="shield" id="vpShield"></div>
    <div class="bar" id="vpBar">
      <input type="range" class="seek" id="vpSeek" min="0" max="1000" value="0">
      <div class="ctrls">
        <button id="vpPlay">▶</button>
        <button id="vpBack">⏪</button>
        <button id="vpFwd">⏩</button>
        <button id="vpMute">🔊</button>
        <span class="time" id="vpTime">0:00 / 0:00</span>
        <select class="sp" id="vpSpeed">
          <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
          <option value="1" selected>1x</option><option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option><option value="2">2x</option>
        </select>
        <button id="vpFs">⛶</button>
      </div>
    </div>
  </div>`;
}

const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };

async function makePlayer(videoId) {
  await loadYT();
  if (!$('ytHost')) return;
  YTP = new YT.Player('ytHost', {
    videoId,
    host: 'https://www.youtube-nocookie.com',
    playerVars: { controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1, iv_load_policy: 3, playsinline: 1 },
    events: { onStateChange: onYTState }
  });
  const vp = $('vp'), seek = $('vpSeek');
  const toggle = () => { if (!YTP || !YTP.getPlayerState) return; YTP.getPlayerState() === 1 ? YTP.pauseVideo() : YTP.playVideo(); };
  $('vpShield').onclick = () => { toggle(); wake(); };
  $('vpPlay').onclick = toggle;
  $('vpBack').onclick = () => YTP && YTP.seekTo(Math.max(0, YTP.getCurrentTime() - 10), true);
  $('vpFwd').onclick  = () => YTP && YTP.seekTo(YTP.getCurrentTime() + 10, true);
  $('vpMute').onclick = () => { if (!YTP) return;
    if (YTP.isMuted()) { YTP.unMute(); $('vpMute').textContent = '🔊'; } else { YTP.mute(); $('vpMute').textContent = '🔇'; } };
  $('vpSpeed').onchange = e => YTP && YTP.setPlaybackRate(Number(e.target.value));
  $('vpFs').onclick = () => toggleFs($('vp'));
  let dragging = false;
  seek.oninput = () => { dragging = true; const d = YTP && YTP.getDuration ? YTP.getDuration() : 0;
    $('vpTime').textContent = fmt(d * seek.value / 1000) + ' / ' + fmt(d); };
  seek.onchange = () => { const d = YTP.getDuration(); YTP.seekTo(d * seek.value / 1000, true); dragging = false; };
  vp.onmousemove = wake; vp.ontouchstart = wake;
  YT_TICK = setInterval(() => {
    if (!YTP || !YTP.getDuration) return;
    const d = YTP.getDuration() || 0, t = YTP.getCurrentTime() || 0;
    if (!dragging && d) { seek.value = Math.round(t / d * 1000); $('vpTime').textContent = fmt(t) + ' / ' + fmt(d); }
  }, 500);
}

function onYTState(e) {
  const playing = e.data === 1;
  if ($('vpPlay')) $('vpPlay').textContent = playing ? '⏸' : '▶';
  if ($('vpCover')) $('vpCover').classList.toggle('gone', playing || e.data === 3);
  if (e.data === 0 && $('vpCover')) $('vpCover').innerHTML = '<div class="bigplay">↺</div>';
  wake();
}

function wake() {
  const vp = $('vp'); if (!vp) return;
  vp.classList.remove('idle');
  clearTimeout(IDLE_T);
  IDLE_T = setTimeout(() => { if (YTP && YTP.getPlayerState && YTP.getPlayerState() === 1 && $('vp')) $('vp').classList.add('idle'); }, 3000);
}

function stopPlayer() {
  clearInterval(YT_TICK); clearTimeout(IDLE_T);
  if (YTP && YTP.destroy) { try { YTP.destroy(); } catch (e) {} }
  YTP = null;
}

// ================= अपना PDF व्यूअर =================
const PDF_CACHE = {};
let PDFDOC = null, PDF_ZOOM = 1, PDF_TOKEN = 0, PDF_RESIZE_T = null;

function pdfHtml() {
  return `<div class="pv" id="pv">
    <div class="pbar">
      <button onclick="pdfZoom(-0.25)">−</button>
      <button onclick="pdfZoom(0.25)">+</button>
      <span class="pinfo" id="pvInfo">लोड हो रहा है...</span>
      <span class="sp2"></span>
      <button onclick="toggleFs($('pv'), renderPdf)">⛶</button>
    </div>
    <div class="pages" id="pvPages"><div class="pmsg">नोट्स लोड हो रहे हैं...</div></div>
  </div>`;
}

async function openPdf(chapterId) {
  const my = ++PDF_TOKEN;
  PDF_ZOOM = 1;
  if (!window.pdfjsLib) { $('pvPages').innerHTML = '<div class="pmsg">PDF व्यूअर लोड नहीं हुआ। पेज रिफ़्रेश करें।</div>'; return; }
  try {
    let bytes = PDF_CACHE[chapterId];
    if (!bytes) {
      const r = await api('getPdf', { chapterId });
      if (my !== PDF_TOKEN) return;
      if (!r.ok) { $('pvPages').innerHTML = `<div class="pmsg">${esc(r.error)}</div>`; return; }
      const bin = atob(r.data); bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      PDF_CACHE[chapterId] = bytes;
    }
    const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    if (my !== PDF_TOKEN) return;
    PDFDOC = doc;
    renderPdf();
    $('pvPages').onscroll = updatePageNo;
  } catch (e) {
    if (my === PDF_TOKEN && $('pvPages')) $('pvPages').innerHTML = '<div class="pmsg">नोट्स नहीं खुल पाए। फिर से कोशिश करें।</div>';
  }
}

async function renderPdf() {
  if (!PDFDOC || !$('pvPages')) return;
  const my = PDF_TOKEN, box = $('pvPages');
  const width = box.clientWidth - 16;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  box.innerHTML = '';
  for (let n = 1; n <= PDFDOC.numPages; n++) {
    const page = await PDFDOC.getPage(n);
    if (my !== PDF_TOKEN || !$('pvPages')) return;
    const base = page.getViewport({ scale: 1 });
    const scale = (width / base.width) * PDF_ZOOM;
    const vp = page.getViewport({ scale: scale * dpr });
    const cv = document.createElement('canvas');
    cv.width = vp.width; cv.height = vp.height;
    cv.style.width = (vp.width / dpr) + 'px'; cv.style.height = (vp.height / dpr) + 'px';
    cv.dataset.page = n;
    box.appendChild(cv);
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    if (n === 1) updatePageNo();
  }
}

function updatePageNo() {
  const box = $('pvPages'); if (!box || !PDFDOC) return;
  let cur = 1; const top = box.scrollTop + box.clientHeight / 3;
  for (const cv of box.querySelectorAll('canvas')) { if (cv.offsetTop <= top) cur = +cv.dataset.page; }
  $('pvInfo').textContent = `पेज ${cur} / ${PDFDOC.numPages}`;
}

function pdfZoom(d) {
  PDF_ZOOM = Math.min(3, Math.max(0.5, PDF_ZOOM + d));
  renderPdf();
}

function stopPdf() { PDF_TOKEN++; PDFDOC = null; }

function refitPdf() { clearTimeout(PDF_RESIZE_T); PDF_RESIZE_T = setTimeout(renderPdf, 300); }
window.addEventListener('resize', refitPdf);
document.addEventListener('fullscreenchange', refitPdf);
document.addEventListener('webkitfullscreenchange', refitPdf);

  if (!confirm(status === 'published' ? 'ये कोर्स पब्लिश करना है?' : 'ये कोर्स रिजेक्ट करना है?')) return;
  const r = await api('setCourseStatus', { courseId: cid, status });
  if (r.ok) pendingCourses(); else alert(r.error);
}

// ================= शुरुआत =================
(async () => {
  if (!localStorage.getItem('token')) return authView();
  try {
    const r = await api('me');
    if (r.ok) { USER = r.user; home(); } else authView();
  } catch (e) { if (!USER) authView(); }
})();
</script>
